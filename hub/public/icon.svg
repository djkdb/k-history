<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111114"/>
      <stop offset="1" stop-color="#09090b"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!--
    현관 — 다섯 칸.
    앱마다 제 아이콘이 있으니 여기는 "고르는 자리" 임을 말해야 한다.
    네 칸을 두고 가운데 하나를 겹쳐 두면 다섯이 되고, 겹친 칸이
    "지금 고른 것" 으로 읽힌다. 색은 다섯 앱의 색을 그대로 쓴다.
  -->
  <rect x="96"  y="96"  width="136" height="136" rx="34" fill="#f59e0b"/>
  <rect x="280" y="96"  width="136" height="136" rx="34" fill="#10b981"/>
  <rect x="96"  y="280" width="136" height="136" rx="34" fill="#0ea5e9"/>
  <rect x="280" y="280" width="136" height="136" rx="34" fill="#f43f5e"/>
  <rect x="186" y="186" width="140" height="140" rx="36" fill="#6366f1" stroke="#09090b" stroke-width="20"/>
</svg>
